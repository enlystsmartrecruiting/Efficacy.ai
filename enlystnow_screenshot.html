<!DOCTYPE html>
<html>
<head>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0A0F;font-family:'Inter',sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px;gap:16px}
h2{color:#F7F6F3;font-size:14px;font-weight:500;letter-spacing:0.04em;opacity:0.6}
.img-wrap{width:100%;border-radius:8px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.08)}
img{width:100%;display:block}
.url{font-size:11px;color:#6E6D7A;letter-spacing:0.06em;text-transform:uppercase}
</style>
</head>
<body>
<div class="url">enlystnow.com — live screenshot</div>
<div class="img-wrap">
  <img 
    src="https://image.thum.io/get/width/1280/crop/900/https://enlystnow.com" 
    alt="enlystnow.com screenshot"
    onerror="this.parentElement.innerHTML='<div style=\'padding:40px;text-align:center;color:#6E6D7A;font-size:13px\'>Screenshot service unavailable.<br>Visit enlystnow.com directly to view the live site.</div>'"
  />
</div>
<div class="url">captured live · July 2026</div>
</body>
</html>
